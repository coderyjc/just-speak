[versions]
agp = "9.4.0"
kotlin = "2.4.20"
activity = "1.13.0"
core = "1.19.0"
webkit = "1.17.0"
okhttp = "5.3.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
testCore = "1.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "testCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "testCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
