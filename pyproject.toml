[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "justspeak-asr"
version = "0.1.0"
description = "Windows desktop client for cloud speech transcription"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "PySide6==6.11.2",
  "dashscope==1.27.4",
  "keyring==25.7.0",
  "numpy==2.3.3",
  "sounddevice==0.5.6",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
]
packaging = [
  "pyinstaller==6.22.2",
]

[project.scripts]
justspeak = "asr_client.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asr_client = ["ui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
